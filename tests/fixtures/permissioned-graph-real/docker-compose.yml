services:
  server:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-server@sha256:fe6708deef9ebb8da8da7b1cb643e83b827769a5be8811961311639aa1f2cb88
    restart: "no"
    depends_on:
      - mysql
      - neo4j
      - minio
    ports:
      - "127.0.0.1::8887"
    environment:
      LANG: C.UTF-8
      TZ: UTC
    command:
      - java
      - -Dfile.encoding=UTF-8
      - -Xms512m
      - -Xmx2048m
      - -jar
      - arks-sofaboot-0.0.1-SNAPSHOT-executable.jar
      - --server.repository.impl.jdbc.host=mysql
      - --server.repository.impl.jdbc.password=openspg
      - --builder.model.execute.num=4
      - --cloudext.graphstore.url=neo4j://neo4j:7687?user=neo4j&password=neo4j@openspg&database=neo4j
      - --cloudext.searchengine.url=neo4j://neo4j:7687?user=neo4j&password=neo4j@openspg&database=neo4j

  mysql:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-mysql@sha256:71eb546d5fc5faf70b3d8a358c022f601591b54a029b79298f2fa0302e46de9a
    restart: "no"
    environment:
      LANG: C.UTF-8
      MYSQL_DATABASE: openspg
      MYSQL_ROOT_PASSWORD: openspg
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql

  neo4j:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-neo4j@sha256:4bc5b7f6b83d333b1d2c8f60ac145c068d77d50bca65b3a07c927f9e2a541eb9
    restart: "no"
    environment:
      NEO4J_AUTH: neo4j/neo4j@openspg
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "*"
      NEO4J_dbms_security_procedures_allowlist: "*"
      TZ: UTC
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  minio:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-minio@sha256:9493c8e8f77edb10d556255d49ba8b5761b0fe57889235dfd10619c0513da007
    restart: "no"
    command:
      - server
      - --console-address
      - :9001
      - /data
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_ROOT_PASSWORD: minio@openspg
      MINIO_ROOT_USER: minio
      MINIO_SECRET_KEY: minio@openspg
      TZ: UTC
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  mysql_data:
  neo4j_data:
  neo4j_logs:
