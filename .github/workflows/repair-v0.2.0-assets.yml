name: Repair v0.2.0 Windows assets

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.event.issue.number == 69 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/repair-v0.2.0-windows-assets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.2.0
      VERIFIED_COMMIT: 2c418bdcbd4ca191a64848332fb800b7971d63e1
      CGO_ENABLED: "0"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          [[ "${tag_commit}" == "${VERIFIED_COMMIT}" ]] || {
            printf 'release tag mismatch\nexpected: %s\nactual:   %s\n' "${VERIFIED_COMMIT}" "${tag_commit}" >&2
            exit 1
          }

      - name: Repackage Windows assets with adapters
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input dist stage
          gh release download "${RELEASE_TAG}" --dir input
          for arch in amd64 arm64; do
            name="knote_${RELEASE_TAG}_windows_${arch}"
            mkdir -p "stage/${name}"
            unzip -q "input/${name}.zip" -d "stage/${name}"
            rm -rf "stage/${name}/adapters"
            cp -R adapters "stage/${name}/adapters"
            (cd "stage/${name}" && zip -qr "../../dist/${name}.zip" ./*)
            unzip -Z1 "dist/${name}.zip" | grep -Fx 'adapters/kag/knote_kag_adapter.py'
            unzip -Z1 "dist/${name}.zip" | grep -Fx 'adapters/kag/test_adapter.py'
          done
          cp input/knote_${RELEASE_TAG}_*.tar.gz dist/
          (cd dist && shasum -a 256 knote_${RELEASE_TAG}_*.tar.gz knote_${RELEASE_TAG}_*.zip > checksums.txt)
          (cd dist && shasum -a 256 -c checksums.txt)

      - name: Replace broken release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          [[ "${tag_commit}" == "${VERIFIED_COMMIT}" ]] || {
            printf 'release tag moved before repair\nexpected: %s\nactual:   %s\n' "${VERIFIED_COMMIT}" "${tag_commit}" >&2
            exit 1
          }
          gh release upload "${RELEASE_TAG}" \
            dist/knote_${RELEASE_TAG}_windows_amd64.zip \
            dist/knote_${RELEASE_TAG}_windows_arm64.zip \
            dist/checksums.txt \
            --clobber
